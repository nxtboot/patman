name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .[test]

      - name: Configure git identity
        run: |
          git config --global user.name 'CI Tester'
          git config --global user.email 'ci@example.com'

      # checkpatch.pl (vendored in scripts/) needs perl, which is present
      # on the runner. The suite is otherwise self-contained. Invoke the
      # installed console script (not 'python -m patman') so argv[0] is
      # 'patman', which a couple of help/usage tests assert.
      - name: Run the test suite
        run: patman test

  test-latest:
    # Run against the newest dependency versions (no requirements.txt
    # pins), which is what a fresh 'pip install patch-manager' gets. This
    # catches breakage from upstream releases (e.g. pygit2) before users
    # hit it, rather than only testing the pinned versions above.
    name: Test (latest deps, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install with the latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[all]

      - name: Configure git identity
        run: |
          git config --global user.name 'CI Tester'
          git config --global user.email 'ci@example.com'

      - name: Run the test suite
        run: patman test

  package:
    name: Build and check the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check the distribution with twine
        run: twine check --strict dist/*

      - name: Install the wheel into a clean environment and smoke-test it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/patman --help > /dev/null
          echo 'entry point works'

      - name: Upload the built distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
