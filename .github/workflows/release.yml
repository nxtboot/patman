name: Release

# Publish to PyPI when a version tag is pushed. Tags containing 'rc'
# (e.g. v0.0.8rc1) go to TestPyPI; final tags (e.g. v0.0.8) go to the
# real PyPI. The workflow can also be run manually (workflow_dispatch)
# to publish the current branch to TestPyPI for a dry run.
# Authentication uses PyPI Trusted Publishing (OIDC), so no API tokens
# are stored in the repository.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check the tag matches the project version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; \
            print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag project version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match" \
                 "pyproject version '$version'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Upload the built distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    # rc tags, or a manual run for a dry run
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/patch-manager/
    permissions:
      id-token: write
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    # only final version tags publish to the real PyPI
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/patch-manager/
    permissions:
      id-token: write
    steps:
      - name: Download the built distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
